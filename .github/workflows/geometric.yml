name: geometric-research

on:
  pull_request:
    paths:
      - 'adiona/geometric/**'
      - 'models/geometric/**'
      - 'research_tests/**'
      - 'tests/test_geometric_contracts.py'
      - 'scripts/geometric_experiment.py'
      - 'pyproject.toml'
      - '.github/workflows/geometric.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometric-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout proposed code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Use the locally evaluated Python series
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install pinned CPU research dependency
        run: python -m pip install 'torch==2.14.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Test learned model and proposal boundary
        run: |
          python -m unittest discover -s research_tests -v
          python -m unittest discover -s tests -v
          python -m adiona.geometric demo --model models/geometric/agrm-seed7.json

# Research checks only. No merge, deployment, policy mutation, or self-approval.
