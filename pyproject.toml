[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adiona-safety"
version = "0.1.0"
description = "Warranted authority, bounded sandbox action, and safe return"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
geometric = ["torch>=2.6,<3"]

[project.scripts]
adiona = "adiona.__main__:main"

[tool.setuptools.packages.find]
include = ["adiona*"]
